name: security check

on:
  # Scan and run tests in PRs
  pull_request:
    branches: [ "main" ]

  # Allow manual runs from the Actions tab
  workflow_dispatch: {}

  # Scan and run tests on mainline branch
  push:
    branches: [ "main" ]

  # Optional scheduled daily run
  schedule:
    - cron: '20 17 * * *' # adjust as needed

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Run Semgrep with both the auto config and custom rules - full scan for reporting
      - name: Semgrep full scan 
        run: semgrep scan --config auto --config .semgrep/rules/

      # 2) Explicit CI gate: fail PR only on ERROR findings. - critical / high findings should block the PR
      - name: Semgrep gate (block on ERROR severity)
        run: semgrep scan --config auto --config .semgrep/rules/ --severity ERROR --error