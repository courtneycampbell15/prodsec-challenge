name: security check

on:
  # Scan and run tests in PRs
  pull_request:
    branches: [main]

  # Allow manual runs from the Actions tab
  workflow_dispatch: {}

  # Scan and run tests on mainline branch
  push:
    branches: ["main"]

  # Optional scheduled daily run
  schedule:
    - cron: '20 17 * * *' # adjust as needed

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout.
      - uses: actions/checkout@v6

      # Run Semgrep with both the auto config and your custom rules.
      - run: semgrep scan --config auto --config .semgrep/rules/

