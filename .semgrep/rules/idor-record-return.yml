rules:
  - id: idor-return-record-without-owner-check
    languages: [python]
    severity: WARNING
    message: >
      Record is loaded with db.get_record(record_id) and returned without an
      ownership check (e.g. record["owner_user_id"] vs current_user). Possible IDOR.
    paths:
      include:
        - "app/routes/**/*.py"
    patterns:
      - pattern-inside: |
          def $HANDLER(..., record_id: str, ...):
              ...
      - pattern: |
          record = db.get_record(record_id)
          ...
          return record
      - pattern-not-inside: |
          record["owner_user_id"]