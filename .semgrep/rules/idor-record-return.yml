rules:
  - id: idor-record-access-without-owner-check
    languages: [python]
    severity: ERROR
    message: >
      Possible IDOR/BAC: record data is fetched by identifier and returned without
      an ownership check against current_user (or equivalent authorization guard).
    paths:
      include:
        - "app/routes/**/*.py"
    patterns:
      - pattern-inside: |
          def $HANDLER(...):
              ...
      - pattern-either:
          - pattern: |
              $REC = db.get_record($RID)
              ...
              return $REC
          - pattern: |
              $REC = db.get_record($RID)
              ...
              return {"record": $REC, ...}
          - pattern: |
              $REC = db.get_record($RID)
              ...
              return {"results": ...}
      - pattern-not-inside: |
          if current_user.role != "staff" and $REC["owner_user_id"] != current_user.id:
              ...
      - pattern-not-inside: |
          if $REC["owner_user_id"] == current_user.id:
              ...